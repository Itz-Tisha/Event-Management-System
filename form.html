


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Club</title>
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #081b29, #0c3b57);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

     
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 0px 15px 0px rgba(0, 255, 238, 0.3);
            width: 420px;
            text-align: center;
            backdrop-filter: blur(8px);
        }

        h1 {
            margin-bottom: 20px;
            color: #fff;
            font-size: 22px;
            font-weight: 600;
        }

       
        form {
            display: flex;
            flex-direction: column;
        }

    
        .mb-3 {
            width: 100%;
            margin-bottom: 15px;
            text-align: left;
        }

    
        label {
            display: flex;
            align-items: center;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }

        label i {
            margin-right: 8px;
            font-size: 18px;
            color: #0ef;
        }

       
        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            outline: none;
            transition: 0.3s ease-in-out;
        }

        input::placeholder, textarea::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        input:focus, textarea:focus {
            background: rgba(255, 255, 255, 0.3);
        }

       
        textarea {
            resize: none;
            height: 80px;
        }

       
        .btn {
            background: #0ef;
            color: #081b29;
            padding: 12px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s ease-in-out, transform 0.2s;
        }

        .btn:hover {
            background: #fff;
            color: #081b29;
            transform: scale(1.05);
        }

        
        @media (max-width: 500px) {
            .container {
                width: 90%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GIVE FEEDBACK</h1>

       
        {% if form.errors %}
        <div class="alert alert-danger">
            <ul>
                {% for field in form %}
                    {% for error in field.errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                {% endfor %}
            </ul>
        </div>
        {% endif %}

      
        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="name"><i class='bx bx-group'></i>  Name</label>
                {{ form.name }} 
            </div>
            
            <div class="mb-3">
                <label for="feedback"><i class='bx bx-pencil'></i> feedback</label>
                {{ form.feedback }}  
            </div>
            
            <button type="submit" class="btn">submit</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
