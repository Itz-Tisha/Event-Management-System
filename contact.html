<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - EVM System</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* General Styles */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
    color: #333;
}

header {
    background: #004080;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 24px;
}

/* Navigation Bar */
nav {
    background: #002850;
    padding: 10px 0;
    text-align: center;
}

nav ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

nav ul li {
    display: inline;
    margin: 0 15px;
}

nav ul li a {
    color: white;
    text-decoration: none;
    font-size: 18px;
}

nav ul li a:hover {
    text-decoration: underline;
}

/* About, Services & Contact Sections */
.about-container, .services-container, .contact-container {
    width: 80%;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

.about-text, .service {
    margin-bottom: 20px;
}

h2 {
    color: #004080;
}

/* Services Page */
.service {
    background: #e6f2ff;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 10px;
}

/* Contact Page */
.contact-container p {
    font-size: 18px;
    margin: 10px 0;
}

/* Responsive Design */
@media (max-width: 768px) {
    .about-container, .services-container, .contact-container {
        width: 95%;
        padding: 15px;
    }

    nav ul li {
        display: block;
        margin: 5px 0;
    }
}

    </style>
</head>
<body>
    <header>
        <h1>Contact Us</h1>
    </header>


    <section class="contact-container">
        <h2>Get in Touch</h2>
        <p>Email: contact@evmsystem.com</p>
        <p>Phone: +123 456 7890</p>
        <p>Address: 123 Voting Lane, City, Country</p>
    </section>
</body>
</html>
