<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up & Login</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f4f4f4;
}

.container {
    width: 300px;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    text-align: center;
}

.input-group {
    margin-bottom: 15px;
    text-align: left;
}

label {
    display: block;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    width: 100%;
    padding: 10px;
    background-color: #28a745;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #218838;
}

#toggleText {
    margin-top: 10px;
}

    </style>
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h2 id="formTitle">Login</h2>
            <form id="form" method ="POST" action="">
               {% csrf_token %}
                <div class="input-group">
                    <label for="uname">Username</label>
                    <input type="text" id="uname" name="uname" placeholder="Enter your Username" required>
                    <label for="password">Password</label>
                    <input type="text" id="pass" name="pass" placeholder="Enter your password" required>
                </div>
               
                <button type="submit" id="submitBtn">login</button>
            </form>
            <!-- <p id="toggleText">Already have an account? <a href="#" onclick="toggleForm()">Login</a></p> -->
        </div>
    </div>
